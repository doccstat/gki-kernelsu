name: Build yogi GKI kernel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - sukisu-kpm
          - resukisu-susfs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential ca-certificates cpio flex git libelf-dev \
            libssl-dev openssl perl python3 rsync unzip zip zstd

      - name: Build pinned source
        run: ./scripts/build.sh

      # build.sh emits the raw Image and Google's generated boot.img together.
      - name: Upload kernel image and metadata
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: yogi-${{ matrix.variant }}-${{ github.sha }}
          path: out/${{ matrix.variant }}/
          if-no-files-found: error
