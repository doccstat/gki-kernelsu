name: Build rtwo LineageOS GKI KernelSU variants

on:
  workflow_dispatch:
    inputs:
      base_boot_url:
        description: 'HTTPS mirror of the pinned LineageOS 20260822 boot.img (same SHA-256)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'config/rtwo/**'
      - 'scripts/build-rtwo.sh'
      - 'scripts/prepare-rtwo-source.sh'
      - 'scripts/fetch-mkbootimg-tools.sh'
      - 'scripts/package-rtwo-boot.sh'
      - 'scripts/test-rtwo-boot.py'
      - 'scripts/verify-rtwo-pins.sh'
      - '.github/workflows/build-rtwo.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - sukisu-kpm
          - resukisu-susfs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VARIANT: ${{ matrix.variant }}
      KERNEL_BUILD_JOBS: 2
      KERNEL_LTO_JOBS: 1
      KERNEL_BUILD_HEARTBEAT_SECONDS: 60
      # Package in a separate step so a packaging failure cannot hide a built Image.
      PACKAGE_BOOT_IMAGE: 0
      RTWO_BASE_BOOT_URL: ${{ inputs.base_boot_url || vars.RTWO_BASE_BOOT_URL }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential ca-certificates clang cpio flex git \
            dwarves lld libelf-dev libssl-dev llvm openssl perl python3 rsync unzip \
            zip zstd curl

      - name: Test LineageOS boot preparation and packaging
        run: python3 scripts/test-rtwo-boot.py

      - name: Prepare and verify pinned LineageOS base boot
        run: ./scripts/package-rtwo-boot.sh --prepare

      - name: Free runner disk for LLVM LTO
        run: |
          set -euo pipefail
          for path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/julia \
            /usr/local/aws-cli \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /usr/share/miniconda; do
            if [[ -e "$path" ]]; then
              sudo rm -rf -- "$path"
            fi
          done
          sudo apt-get clean
          df -h

      - name: Add swap for LLVM LTO
        run: |
          set -euo pipefail
          swap_path="$RUNNER_TEMP/gki-kernelsu.swap"
          if ! swapon --show=NAME --noheadings --raw | grep -Fxq "$swap_path"; then
            sudo fallocate -l 16G "$swap_path"
            sudo chmod 600 "$swap_path"
            sudo mkswap "$swap_path"
            sudo swapon "$swap_path"
          fi
          sudo sysctl vm.swappiness=100
          free -h
          swapon --show

      - name: Build pinned rtwo Image
        id: kernel
        run: ./scripts/build-rtwo.sh

      - name: Package LineageOS boot image
        id: package
        run: ./scripts/package-rtwo-boot.sh

      - name: Upload raw kernel if packaging fails
        if: ${{ failure() && steps.kernel.outcome == 'success' && steps.package.outcome == 'failure' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: rtwo-${{ matrix.variant }}-${{ github.sha }}-unpackaged
          path: |
            out/rtwo/${{ matrix.variant }}/Image
            out/rtwo/${{ matrix.variant }}/Image.sha256
            out/rtwo/${{ matrix.variant }}/build-metadata.txt
          if-no-files-found: error

      - name: Upload rtwo kernel image and metadata
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: rtwo-${{ matrix.variant }}-${{ github.sha }}
          path: out/rtwo/${{ matrix.variant }}/
          if-no-files-found: error
